<style>
:root{--bg:#0b1220;--bg2:#0f1a30;--card:#131f38;--line:#223152;--ink:#e8edf7;--mute:#9aa8c4;--a:#38bdf8;--b:#6366f1;--ok:#34d399}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.w{max-width:1080px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:0;z-index:9;background:rgba(11,18,32,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .w{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{font-weight:800;letter-spacing:.3px}.logo b{color:var(--a)}
nav ul{display:flex;gap:22px;list-style:none;padding:0;font-size:14px;color:var(--mute)}
nav ul a:hover{color:var(--ink)}
.hero{padding:84px 0 70px;background:radial-gradient(900px 400px at 85% -10%,rgba(99,102,241,.28),transparent),radial-gradient(700px 380px at 0% 10%,rgba(56,189,248,.18),transparent)}
.hero .w{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:center}
.tag{display:inline-block;font-size:13px;color:var(--a);border:1px solid rgba(56,189,248,.4);background:rgba(56,189,248,.08);padding:4px 12px;border-radius:99px;margin-bottom:18px}
h1{font-size:clamp(34px,6vw,58px);line-height:1.1;font-weight:800;letter-spacing:-1.2px}
h1 span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--mute);font-size:18px;margin:18px 0 28px;max-width:560px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{padding:12px 22px;border-radius:10px;font-weight:600;font-size:15px;border:1px solid var(--line);transition:.2s}
.btn.p{background:linear-gradient(90deg,var(--a),var(--b));border:0;color:#04101f}
.btn:hover{transform:translateY(-2px);border-color:var(--a)}
.avatar{justify-self:center;width:230px;height:230px;border-radius:50%;display:grid;place-items:center;font-size:72px;font-weight:800;background:linear-gradient(135deg,var(--a),var(--b));color:#04101f;box-shadow:0 0 0 10px rgba(56,189,248,.1),0 30px 80px rgba(99,102,241,.35);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:-34px;position:relative}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center}
.stat b{display:block;font-size:30px;color:var(--a);font-weight:800}
.stat small{color:var(--mute);font-size:13px}
section{padding:78px 0}
.alt{background:var(--bg2)}
h2{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.sub{color:var(--mute);margin-bottom:34px}
.tl{border-left:2px solid var(--line);padding-left:26px;margin-left:6px}
.job{position:relative;margin-bottom:34px}
.job:before{content:"";position:absolute;left:-34px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--a);box-shadow:0 0 0 4px var(--bg)}
.alt .job:before{box-shadow:0 0 0 4px var(--bg2)}
.job h3{font-size:19px}.job .m{color:var(--mute);font-size:14px;margin-bottom:10px}
.job ul{padding-left:18px;color:#c9d3e6}.job li{margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:.25s}
.card:hover{transform:translateY(-6px);border-color:var(--a);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.shot{position:relative;aspect-ratio:2/1;background:linear-gradient(135deg,#0c2a4a,#1b1f55);display:grid;place-items:center;overflow:hidden}
.shot.z{cursor:zoom-in}
.shot .ph{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;font-weight:700;font-size:20px;color:rgba(255,255,255,.35)}
.shot.has .ph{display:none}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top left;opacity:0;transition:opacity .8s}
.shot img.on{opacity:1}
.shot .zoom{position:absolute;right:10px;bottom:10px;z-index:2;background:rgba(5,9,18,.78);color:#fff;font-size:12px;padding:4px 11px;border-radius:99px;pointer-events:none;border:1px solid rgba(255,255,255,.18)}
.cb{padding:20px;display:flex;flex-direction:column;flex:1}
.cb h3{font-size:18px;margin-bottom:4px}
.badge{font-size:11px;color:var(--ok);border:1px solid rgba(52,211,153,.4);padding:1px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.cb p{color:var(--mute);font-size:14.5px;margin:8px 0 14px;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;padding:5px 12px;border-radius:99px;background:rgba(56,189,248,.08);border:1px solid var(--line);color:#cfe3f7}
.cb .chips{margin-bottom:16px}
.open{color:var(--a);font-weight:600;font-size:14px;cursor:pointer}.open:hover{text-decoration:underline}
.note{display:block;margin-top:10px;color:var(--mute);font-size:12.5px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.box h3{font-size:17px;margin-bottom:14px}
.box p{margin-bottom:12px;font-size:15px}.box p small{display:block;color:var(--mute)}
.contact{text-align:center}
.contact .btns{justify-content:center;margin-top:24px}
footer{padding:26px 0;text-align:center;color:var(--mute);font-size:13px;border-top:1px solid var(--line)}
.rv{opacity:0;transform:translateY(20px);transition:.7s}.rv.in{opacity:1;transform:none}
#lb{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,9,18,.93);backdrop-filter:blur(6px);padding:56px 16px 18px}
#lb.on{display:flex}#lb img{max-width:min(1500px,100%);max-height:calc(100vh - 150px);width:auto;height:auto;border-radius:12px;border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.6)}
#lb .bar{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px;color:var(--mute);font-size:14px;text-align:center}
#lb .go{color:#04101f;background:linear-gradient(90deg,var(--a),var(--b));padding:7px 16px;border-radius:9px;font-weight:600}
#lb button{position:absolute;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:99px;width:44px;height:44px;font-size:22px;cursor:pointer;line-height:1}
#lb button:hover{background:rgba(56,189,248,.35)}#lb .x{top:12px;right:16px}#lb .pv{left:14px;top:50%}#lb .nx{right:14px;top:50%}#lb.one .pv,#lb.one .nx{display:none}
.err{position:fixed;top:0;left:0;right:0;z-index:99;background:#7f1d1d;color:#fff;padding:14px 20px;font-size:15px;line-height:1.55;border-bottom:3px solid #f87171}
.err b{display:block;margin-bottom:2px}
@media(max-width:820px){.hero .w,.two{grid-template-columns:1fr}.avatar{width:170px;height:170px;font-size:52px;order:-1}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}nav ul{display:none}#lb .pv,#lb .nx{top:auto;bottom:16px}#lb .pv{left:16px}#lb .nx{right:16px}}
@media(prefers-reduced-motion:reduce){.shot img{transition:none}.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style>

<script>
(function(){

/* ---------- alat bantu membuat elemen (aman: teks tidak dibaca sebagai HTML) ---------- */
function el(tag,attrs,kids){
  var n=document.createElement(tag),k;
  if(attrs)for(k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')n.className=v;else if(k==='text')n.textContent=v;
    else if(k.indexOf('on')===0)n[k]=v;else n.setAttribute(k,v===true?'':v)}

}

  function kd(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}
  if(gambar.length){
    shot.classList.add('z');shot.tabIndex=0;shot.setAttribute('role','button');
    shot.setAttribute('aria-label','Perbesar gambar '+p.nama);
    shot.append(el('span',{class:'zoom',text:'🔍 Klik untuk perbesar'}));
    shot.onclick=open;shot.onkeydown=kd;
  }
  if(p.link){
    cb.append(el('a',{class:'open',href:p.link,target:'_blank',rel:'noopener',text:'Buka aplikasi →'}));
  }else if(gambar.length){
    cb.append(el('span',{class:'open',role:'button',tabindex:'0',text:'Lihat tampilan →',onclick:open,onkeydown:kd}));
  }
  if(p.catatan)cb.append(el('small',{class:'note',text:p.catatan}));
  return c;
}

/* ---------- membangun halaman dari SITE ---------- */
function build(S){
  var nProyek=((S.proyek&&S.proyek.daftar)||[]).length;
  document.title=S.situs.judul;
  var md=document.querySelector('meta[name=description]');if(md)md.setAttribute('content',S.situs.deskripsi||'');

  var NAV={pengalaman:'Pengalaman',proyek:'Proyek',keahlian:'Keahlian',pendidikan:'Pendidikan',kontak:'Kontak'};
  var order=['pengalaman','proyek','keahlian','pendidikan','kontak'].filter(function(n){return S[n]&&S[n].tampil!==false});

  document.getElementById('nav').append(el('div',{class:'w'},[
    el('a',{class:'logo',href:'#'},[S.situs.logo||'',el('b',{text:'.'})]),
    el('ul',null,order.map(function(n){return el('li',null,[el('a',{href:'#'+n,text:NAV[n]})])}))
  ]));

  var P=S.profil,app=document.getElementById('app');

  /* hero */
  var av=el('div',{class:'avatar','aria-label':'Foto profil'});
  if(P.foto){var fi=new Image();fi.alt=P.nama;fi.onerror=function(){av.textContent=P.inisial||''};fi.src=fotoSrc(P.foto);av.append(fi)}
  else av.textContent=P.inisial||'';
  var jb=P.judulBesar||[];
  app.append(el('header',{class:'hero'},[el('div',{class:'w'},[
    el('div',null,[
      el('span',{class:'tag',text:P.label}),
      el('h1',null,[jb[0]?jb[0]+' ':'',jb[1]?el('span',{text:jb[1]}):null]),
      el('p',{class:'lead',text:P.pengantar}),
      el('div',{class:'btns'},[
        order.indexOf('proyek')>-1?el('a',{class:'btn p',href:'#proyek',text:'Lihat Proyek'}):null,
        cvLink(P)
      ])
    ]),av
  ])]));

  /* statistik */
  if(S.statistik&&S.statistik.length){
    app.append(el('div',{class:'w'},[el('div',{class:'stats rv'},S.statistik.map(function(s){
      return el('div',{class:'stat'},[el('b',{text:String(s.angka).replace('{proyek}',nProyek)}),el('small',{text:s.ket})])
    }))]));
  }

  /* bagian-bagian */
  var BODY={
    pengalaman:function(d){
      return el('div',{class:'tl'},(d.daftar||[]).map(function(r){
        return el('div',{class:'job rv'},[
          el('h3',{text:r.posisi}),
          el('div',{class:'m',text:r.periode+(r.tempat?' · '+r.tempat:'')}),
          el('ul',null,(r.poin||[]).map(function(t){return el('li',{text:t})}))
        ])
      }));
    },
    proyek:function(d){return el('div',{class:'grid'},(d.daftar||[]).map(card))},
    keahlian:function(d){
      return el('div',{class:'two'},(d.kelompok||[]).map(function(g){
        return el('div',{class:'box rv'},[el('h3',{text:g.judul}),
          el('div',{class:'chips'},(g.isi||[]).map(function(t){return el('span',{class:'chip',text:t})}))])
      }));
    },
    pendidikan:function(d){
      return el('div',{class:'two'},(d.kelompok||[]).map(function(g){
        return el('div',{class:'box rv'},[el('h3',{text:g.judul})].concat((g.daftar||[]).map(function(i){
          return el('p',null,[el('b',{text:i.nama}),i.ket?el('small',{text:i.ket}):null])
        })))
      }));
    },
    kontak:function(d){
      return el('div',{class:'btns rv'},(d.tombol||[]).map(function(t){
        var u=su(t.url),e=ext(u);
        return el('a',{class:'btn'+(t.utama?' p':''),href:u,target:e?'_blank':null,rel:e?'noopener':null,text:t.label});
      }));
    }
  };
  order.forEach(function(n,i){
    var d=S[n];
    app.append(el('section',{id:n,class:((i%2)?'alt':'')+(n==='kontak'?' contact':'')},[el('div',{class:'w'},[
      el('h2',{class:'rv',text:d.judul}),
      d.subjudul?el('p',{class:'sub rv',text:d.subjudul}):null,
      BODY[n](d)
    ])]));
  });

  document.getElementById('foot').textContent='© '+new Date().getFullYear()+' '+P.nama;

  /* animasi muncul saat di-scroll */
  var rv=document.querySelectorAll('.rv');
  if(PREVIEW||!('IntersectionObserver' in window)){
    rv.forEach(function(e){e.classList.add('in')});
  }else{
    var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:.12});
    rv.forEach(function(e){io.observe(e)});
  }

  /* gambar bergantian otomatis di kartu yang punya lebih dari satu gambar */
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches){
    iv=setInterval(function(){
      document.querySelectorAll('.shot').forEach(function(sh){
        var im=[].slice.call(sh.querySelectorAll('img'));if(im.length<2)return;
        var i=im.findIndex(function(m){return m.classList.contains('on')});
        im[i<0?0:i].classList.remove('on');im[(i+1)%im.length].classList.add('on');
      });
    },3800);
  }
}

/* ---------- menerima draf dari editor.html (hanya di mode pratinjau) ---------- */
if(PREVIEW){
  window.addEventListener('message',function(e){
    var d=e.data;if(!d||typeof d!=='object')return;
    if(d.type==='site-preview'&&d.site){
      window.__previewImages=d.images||{};
      var y=window.scrollY;
      try{reset();build(d.site)}catch(err){reset();showError('Draf belum lengkap: '+err.message)}
      window.scrollTo(0,y);
    }else if(d.type==='goto'){
      var t=d.id==='top'?null:document.getElementById(d.id);
      if(d.id==='top')window.scrollTo({top:0,behavior:'smooth'});else if(t)t.scrollIntoView({behavior:'smooth'});
    }
  });
}

/* ---------- mulai ---------- */
if(typeof SITE==='undefined'){
  showError(window.__dataMissing
    ?'File data.js tidak ditemukan. Pastikan data.js berada di folder yang sama dengan index.html.'
    :'File data.js ada kesalahan penulisan'+(window.__dataErr?': '+window.__dataErr:'')+'. Biasanya ada tanda kutip atau koma yang kurang atau berlebih, tepat di atas atau di bawah baris itu. Tekan F12 lalu buka tab Console untuk melihat nomor barisnya.');
}else{
  try{build(SITE)}catch(e){
    console.error(e);
    showError('Ada bagian di data.js yang belum lengkap ('+e.message+'). Periksa bagian yang terakhir kamu ubah.');
  }
}
})();
</script>
</body>
</html>
